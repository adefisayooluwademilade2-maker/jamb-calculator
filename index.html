
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAMB Calculator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px;
  background: #f1f3f5;
  font-family: Arial, sans-serif;
}

.calculator {
  width: 100%;
  max-width: 360px;
  padding: 18px;
  background: white;
  border: 1px solid #d5d9dd;
  border-radius: 8px;
  box-shadow: 0 3px 12px #00000017;
}

h2 {
  text-align: center;
  font-size: 19px;
  margin: 0 0 14px;
}

#display {
  width: 100%;
  min-height: 75px;
  margin-bottom: 14px;
  padding: 15px 10px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  overflow-wrap: anywhere;
  overflow: hidden;
  background: #fafafa;
  border: 1px solid #c8cdd2;
  border-radius: 4px;
  font-size: 30px;
  text-align: right;
}

.keys {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

button {
  min-height: 52px;
  border: 1px solid #d2d6da;
  border-radius: 4px;
  background: #f4f5f6;
  font-size: 20px;
  color: #222;
  cursor: pointer;
}

button:active {
  background: #dfe3e6;
}

.operator {
  background: #e9ecef;
}

.clear {
  background: #f7dddd;
}

.equals {
  background: #d8eadb;
  font-weight: bold;
}

.zero {
  grid-column: span 2;
}

.note {
  margin-top: 12px;
  text-align: center;
  color: #666;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="calculator">
  <h2>JAMB Calculator</h2>

  <div id="display" aria-live="polite">0</div>

  <div class="keys">
    <button class="clear" data-action="clear">C</button>
    <button class="operator" data-action="delete">Del</button>
    <button class="operator" data-value="/">÷</button>
    <button class="operator" data-value="*">×</button>

    <button data-value="7">7</button>
    <button data-value="8">8</button>
    <button data-value="9">9</button>
    <button class="operator" data-value="-">−</button>

    <button data-value="4">4</button>
    <button data-value="5">5</button>
    <button data-value="6">6</button>
    <button class="operator" data-value="+">+</button>

    <button data-value="1">1</button>
    <button data-value="2">2</button>
    <button data-value="3">3</button>
    <button class="equals" data-action="equals">=</button>

    <button class="zero" data-value="0">0</button>
    <button data-value=".">.</button>
  </div>

  <p class="note">C clears all. Del removes one character.</p>
</div>

<script>
const display = document.getElementById("display");

let expression = "";
let justCalculated = false;
let errorState = false;

function render() {
  display.textContent = expression || "0";
}

function addValue(value) {
  if (errorState) {
    expression = "";
    errorState = false;
  }

  const isNumber = /^[0-9.]$/.test(value);

  if (justCalculated) {
    if (isNumber) {
      expression = value === "." ? "0." : value;
      justCalculated = false;
      render();
      return;
    }

    justCalculated = false;
  }

  if (isNumber) {
    if (value === ".") {
      const currentNumber = expression.split(/[+\-*/]/).pop();

      if (currentNumber.includes(".")) return;
      if (!currentNumber) expression += "0";
    }

    expression += value;
  } else {
    if (!expression) {
      if (value === "-") expression = "-";
      else return;
    } else if (/[+\-*/.]$/.test(expression)) {
      if (value === "-" && /[*/+]$/.test(expression)) {
        expression += value;
      } else {
        expression = expression.slice(0, -1) + value;
      }
    } else {
      expression += value;
    }
  }

  render();
}

function clearAll() {
  expression = "";
  justCalculated = false;
  errorState = false;
  render();
}

function deleteLast() {
  if (errorState || justCalculated) {
    expression = "";
    errorState = false;
    justCalculated = false;
  } else {
    expression = expression.slice(0, -1);
  }

  render();
}

// Safely calculate arithmetic without using eval().
function evaluate(input) {
  const s = input.replace(/\s+/g, "");
  if (!s) throw Error("Empty expression");

  let i = 0;

  function parseExpression() {
    let value = parseTerm();

    while (s[i] === "+" || s[i] === "-") {
      const op = s[i++];
      const right = parseTerm();

      value = op === "+"
        ? value + right
        : value - right;
    }

    return value;
  }

  function parseTerm() {
    let value = parseUnary();

    while (s[i] === "*" || s[i] === "/") {
      const op = s[i++];
      const right = parseUnary();

      if (op === "/" && right === 0) {
        throw Error("Cannot divide by zero");
      }

      value = op === "*"
        ? value * right
        : value / right;
    }

    return value;
  }

  function parseUnary() {
    if (s[i] === "+") {
      i++;
      return parseUnary();
    }

    if (s[i] === "-") {
      i++;
      return -parseUnary();
    }

    return parseNumber();
  }

  function parseNumber() {
    const start = i;
    let dots = 0;

    while (i < s.length && /[0-9.]/.test(s[i])) {
      if (s[i] === ".") dots++;
      i++;
    }

    if (start === i || dots > 1) {
      throw Error("Invalid number");
    }

    const number = Number(s.slice(start, i));

    if (!Number.isFinite(number)) {
      throw Error("Invalid number");
    }

    return number;
  }

  const result = parseExpression();

  if (i !== s.length || !Number.isFinite(result)) {
    throw Error("Invalid expression");
  }

  return result;
}

function calculate() {
  if (!expression || errorState) return;

  try {
    const result = evaluate(expression);

    // Show only the answer after pressing "=".
    expression = String(Number(result.toPrecision(12)));

    justCalculated = true;
    errorState = false;
    render();
  } catch (error) {
    expression = "Error";
    justCalculated = false;
    errorState = true;
    render();
  }
}

document.querySelector(".keys").addEventListener("click", function(event) {
  const button = event.target.closest("button");
  if (!button) return;

  if (button.dataset.action === "clear") {
    clearAll();
  } else if (button.dataset.action === "delete") {
    deleteLast();
  } else if (button.dataset.action === "equals") {
    calculate();
  } else if (button.dataset.value !== undefined) {
    addValue(button.dataset.value);
  }
});

document.addEventListener("keydown", function(event) {
  if (/^[0-9.]$/.test(event.key)) {
    addValue(event.key);
  } else if (["+", "-", "*", "/"].includes(event.key)) {
    addValue(event.key);
  } else if (event.key === "Enter" || event.key === "=") {
    calculate();
  } else if (event.key === "Backspace") {
    deleteLast();
  } else if (event.key === "Escape" || event.key === "Delete") {
    clearAll();
  }
});

render();
</script>

</body>
</html>
