
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google-site-verification" content="Pa09ezhUhu7f5NaU9DvS6R2dy6RAX7-TgHwWaQny-5g">
  <meta name="description" content="JAMB Calculator is a free online calculator for quick and easy calculations. Add, subtract, multiply and divide on your phone, tablet or computer.">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="JAMB Calculator | Free Online Calculator">
  <meta property="og:description" content="Use JAMB Calculator for quick, easy everyday calculations on any device.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://adefisayooluwademilade2-maker.github.io/jamb-calculator/">

  <title>JAMB Calculator | Free Online Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      background: #e9edf2;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .calculator {
      width: 100%;
      max-width: 370px;
      background: #f5f5f5;
      border: 1px solid #bfc3c7;
      box-shadow: 0 3px 12px #0002;
      overflow: hidden;
    }

    .titlebar {
      height: 43px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 13px;
      background: #ddd;
      border-bottom: 1px solid #c6c6c6;
      font-size: 15px;
      font-weight: bold;
    }

    .close {
      width: 43px;
      height: 42px;
      border: 0;
      border-radius: 0;
      background: #e65d49;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    .display {
      min-height: 92px;
      padding: 18px 14px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      background: white;
      border-bottom: 1px solid #d4d4d4;
      font-size: 36px;
      text-align: right;
      overflow-wrap: anywhere;
      overflow: hidden;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
      padding: 10px;
      background: #f5f5f5;
    }

    button.key {
      min-height: 58px;
      border: 1px solid #d0d0d0;
      border-radius: 2px;
      background: #fafafa;
      color: #222;
      font-size: 22px;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    button.key:active {
      filter: brightness(.93);
    }

    button.operator,
    button.clear,
    button.del {
      background: #e7e7e7;
    }

    button.equals {
  background: #ee8b26;
  border-color: #d97917;
  color: white;
  font-weight: bold;
  grid-row: span 2;
  min-height: 123px;
      }

    button.zero {
      grid-column: span 2;
    }

    .note {
      margin: 0;
      padding: 0 10px 10px;
      text-align: center;
      color: #666;
      font-size: 11px;
    }
  </style>
</head>

<body>
  <main class="calculator">
    <div class="titlebar">
      <span>JAMB Calculator</span>
      <button class="close" id="closeBtn" type="button" aria-label="Clear calculator">×</button>
    </div>

    <div class="display" id="display" aria-live="polite">0</div>

    <div class="keys" id="keys">
      <button class="key clear" data-action="clear">C</button>
      <button class="key del" data-action="delete">Del</button>
      <button class="key operator" data-value="/">÷</button>
      <button class="key operator" data-value="*">×</button>

      <button class="key" data-value="7">7</button>
      <button class="key" data-value="8">8</button>
      <button class="key" data-value="9">9</button>
      <button class="key operator" data-value="-">−</button>

      <button class="key" data-value="4">4</button>
      <button class="key" data-value="5">5</button>
      <button class="key" data-value="6">6</button>
      <button class="key operator" data-value="+">+</button>

      <button class="key" data-value="1">1</button>
      <button class="key" data-value="2">2</button>
      <button class="key" data-value="3">3</button>
      <button class="key equals" data-action="calculate">=</button>

      <button class="key zero" data-value="0">0</button>
      <button class="key" data-value=".">.</button>
    </div>

    <p class="note">JAMB Calculator · Free online calculator</p>
  </main>

  <script>
    const display = document.getElementById("display");
    const keys = document.getElementById("keys");
    const closeBtn = document.getElementById("closeBtn");

    let expression = "";
    let justCalculated = false;

    function render() {
      display.textContent =
        expression.replace(/\*/g, "×").replace(/\//g, "÷") || "0";
    }

    function clearAll() {
      expression = "";
      justCalculated = false;
      render();
    }

    function appendValue(value) {
      const operators = ["+", "-", "*", "/"];

      if (justCalculated && !operators.includes(value) && value !== ".") {
        expression = "";
      }

      justCalculated = false;

      if (operators.includes(value)) {
        if (!expression && value !== "-") return;

        if (operators.includes(expression.slice(-1))) {
          expression = expression.slice(0, -1);
        }

        expression += value;
        render();
        return;
      }

      if (value === ".") {
        const currentNumber = expression.split(/[+\-*/]/).pop();

        if (currentNumber.includes(".")) return;

        if (!currentNumber) expression += "0";
      }

      expression += value;
      render();
    }

    function calculate() {
      if (!expression) return;

      const safeExpression = expression;

      if (!/^[0-9+\-*/.()\s]+$/.test(safeExpression)) {
        display.textContent = "Invalid input";
        return;
      }

      if (/[+\-*/.]$/.test(safeExpression)) {
        display.textContent = "Complete the calculation";
        return;
      }

      try {
        const result = Function(
          '"use strict"; return (' + safeExpression + ')'
        )();

        if (typeof result !== "number" || !Number.isFinite(result)) {
          display.textContent = "Cannot divide by zero";
          expression = "";
          justCalculated = false;
          return;
        }

        expression = String(
          Number(result.toPrecision(12))
        );

        justCalculated = true;
        render();
      } catch (error) {
        display.textContent = "Invalid calculation";
      }
    }

    keys.addEventListener("click", function(event) {
      const button = event.target.closest("button");

      if (!button) return;

      if (button.dataset.action === "clear") {
        clearAll();
      } else if (button.dataset.action === "delete") {
        expression = expression.slice(0, -1);
        justCalculated = false;
        render();
      } else if (button.dataset.action === "calculate") {
        calculate();
      } else if (button.dataset.value !== undefined) {
        appendValue(button.dataset.value);
      }
    });

    closeBtn.addEventListener("click", clearAll);

    document.addEventListener("keydown", function(event) {
      if (/^[0-9.]$/.test(event.key)) {
        appendValue(event.key);
      } else if (["+", "-", "*", "/"].includes(event.key)) {
        appendValue(event.key);
      } else if (event.key === "Enter" || event.key === "=") {
        event.preventDefault();
        calculate();
      } else if (event.key === "Backspace") {
        expression = expression.slice(0, -1);
        justCalculated = false;
        render();
      } else if (event.key === "Escape" || event.key === "Delete") {
        clearAll();
      }
    });
  </script>
</body>
</html>
