
<!DOCTYPE html>

<title>JAMB Calculator</title>
<meta name="description" content="Use JAMB Calculator, a free online calculator for quick and easy calculations. Add, subtract, multiply and divide on your phone, tablet or computer.">
<meta property="og:title" content="JAMB Calculator | Free Online Calculator">
<meta property="og:description" content="Free online calculator for quick, easy everyday calculations on any device.">ers.">
  
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px;background:#e9edf2;font-family:Arial,sans-serif;color:#222}
.calculator{width:100%;max-width:370px;background:#f5f5f5;border:1px solid #bfc3c7;box-shadow:0 3px 12px #0002;overflow:hidden}
.titlebar{height:43px;display:flex;align-items:center;justify-content:space-between;padding-left:13px;background:#ddd;border-bottom:1px solid #c6c6c6;font-size:15px;font-weight:bold}
.close{width:43px;height:42px;border:0;border-radius:0;background:#e65d49;color:white;font-size:24px;min-height:42px}
.display{min-height:92px;padding:18px 14px;display:flex;align-items:center;justify-content:flex-end;background:white;border-bottom:1px solid #d4d4d4;font-size:36px;text-align:right;overflow-wrap:anywhere;overflow:hidden}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding:10px;background:#f5f5f5}
button.key{min-height:58px;border:1px solid #d0d0d0;border-radius:2px;background:#fafafa;color:#222;font-size:22px;cursor:pointer}
button.key:active{filter:brightness(.93)}
button.operator{background:#e7e7e7}
button.clear,button.del{background:#e7e7e7}
button.equals{background:#ee8b26;border-color:#d97917;color:white;font-weight:bold;grid-row:span 2;min-height:123px}
button.zero{grid-column:span 2}
.note{margin:0;padding:0 10px 10px;text-align:center;color:#666;font-size:11px}
</style>
</head>
<body>
<main class="calculator">
  <div class="titlebar">
    <span>JAMB Calculator</span>
    <button class="close" id="closeBtn" type="button">×</button>
  </div>

  <div id="display" class="display" aria-live="polite">0</div>

  <div class="keys">
    <button class="key clear" data-action="clear">C</button>
    <button class="key del" data-action="delete">Del</button>
    <button class="key operator" data-value="+">+</button>
    <button class="key operator" data-value="*">×</button>

    <button class="key" data-value="7">7</button>
    <button class="key" data-value="8">8</button>
    <button class="key" data-value="9">9</button>
    <button class="key operator" data-value="/">÷</button>

    <button class="key" data-value="4">4</button>
    <button class="key" data-value="5">5</button>
    <button class="key" data-value="6">6</button>
    <button class="key operator" data-value="-">−</button>

    <button class="key" data-value="1">1</button>
    <button class="key" data-value="2">2</button>
    <button class="key" data-value="3">3</button>
    <button class="key equals" data-action="equals">=</button>

    <button class="key zero" data-value="0">0</button>
    <button class="key" data-value=".">.</button>
  </div>

  <p class="note">C clears all · Del removes the last character</p>
</main>

<script>
const display = document.getElementById("display");
let expression = "";
let justCalculated = false;
let errorState = false;

function render() {
  display.textContent = expression.replace(/\*/g, "×").replace(/\//g, "÷") || "0";
}

function addValue(value) {
  if (errorState) {
    expression = "";
    errorState = false;
  }

  const isNumber = /^[0-9.]$/.test(value);

  if (justCalculated) {
    if (isNumber) {
      expression = value === "." ? "0." : value;
      justCalculated = false;
      render();
      return;
    }
    justCalculated = false;
  }

  if (isNumber) {
    if (value === ".") {
      const current = expression.split(/[+\-*/]/).pop();
      if (current.includes(".")) return;
      if (!current) expression += "0";
    }
    expression += value;
  } else {
    if (!expression) {
      if (value === "-") expression = "-";
      else return;
    } else if (/[+\-*/.]$/.test(expression)) {
      if (value === "-" && /[*/+]$/.test(expression)) {
        expression += value;
      } else {
        expression = expression.slice(0, -1) + value;
      }
    } else {
      expression += value;
    }
  }

  render();
}

function clearAll() {
  expression = "";
  justCalculated = false;
  errorState = false;
  render();
}

function deleteLast() {
  if (errorState || justCalculated) {
    expression = "";
    errorState = false;
    justCalculated = false;
  } else {
    expression = expression.slice(0, -1);
  }
  render();
}

function evaluate(input) {
  const s = input.replace(/\s+/g, "");
  if (!s) throw Error("Empty expression");
  let i = 0;

  function parseExpression() {
    let v = parseTerm();
    while (s[i] === "+" || s[i] === "-") {
      const op = s[i++];
      const r = parseTerm();
      v = op === "+" ? v + r : v - r;
    }
    return v;
  }

  function parseTerm() {
    let v = parseUnary();
    while (s[i] === "*" || s[i] === "/") {
      const op = s[i++];
      const r = parseUnary();
      if (op === "/" && r === 0) throw Error("Cannot divide by zero");
      v = op === "*" ? v * r : v / r;
    }
    return v;
  }

  function parseUnary() {
    if (s[i] === "+") {
      i++;
      return parseUnary();
    }
    if (s[i] === "-") {
      i++;
      return -parseUnary();
    }
    return parseNumber();
  }

  function parseNumber() {
    const start = i;
    let dots = 0;
    while (i < s.length && /[0-9.]/.test(s[i])) {
      if (s[i] === ".") dots++;
      i++;
    }
    if (start === i || dots > 1) throw Error("Invalid number");
    const n = Number(s.slice(start, i));
    if (!Number.isFinite(n)) throw Error("Invalid number");
    return n;
  }

  const result = parseExpression();
  if (i !== s.length || !Number.isFinite(result)) {
    throw Error("Invalid expression");
  }
  return result;
}

function calculate() {
  if (!expression || errorState) return;

  try {
    const result = evaluate(expression);
    expression = String(Number(result.toPrecision(12)));
    justCalculated = true;
    errorState = false;
    render();
  } catch (error) {
    expression = "Error";
    justCalculated = false;
    errorState = true;
    render();
  }
}

document.querySelector(".keys").addEventListener("click", function(event) {
  const button = event.target.closest("button");
  if (!button) return;

  if (button.dataset.action === "clear") clearAll();
  else if (button.dataset.action === "delete") deleteLast();
  else if (button.dataset.action === "equals") calculate();
  else if (button.dataset.value !== undefined) addValue(button.dataset.value);
});

document.addEventListener("keydown", function(event) {
  if (/^[0-9.]$/.test(event.key)) addValue(event.key);
  else if (["+", "-", "*", "/"].includes(event.key)) addValue(event.key);
  else if (event.key === "Enter" || event.key === "=") calculate();
  else if (event.key === "Backspace") deleteLast();
  else if (event.key === "Escape" || event.key === "Delete") clearAll();
});

document.getElementById("closeBtn").addEventListener("click", clearAll);
render();
</script>
</body>
</html>
