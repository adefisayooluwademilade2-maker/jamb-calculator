  <script>
    const display = document.getElementById("display");
    const keys = document.getElementById("keys");
    const closeBtn = document.getElementById("closeBtn");

    const themeToggle = document.getElementById("themeToggle");

if (localStorage.getItem("jambTheme") === "dark") {
  document.body.classList.add("dark-mode");
  themeToggle.textContent = "☀️";
}

themeToggle.addEventListener("click", () => {
  document.body.classList.toggle("dark-mode");

  const isDark = document.body.classList.contains("dark-mode");
  themeToggle.textContent = isDark ? "☀️" : "🌙";
  localStorage.setItem("jambTheme", isDark ? "dark" : "light");
});
    
    let expression = "";
    let justCalculated = false;

    function render() {
      display.textContent =
        expression.replace(/\*/g, "×").replace(/\//g, "÷") || "0";
    }

    function clearAll() {
      expression = "";
      justCalculated = false;
      render();
    }

function appendValue(value) {
  if (justCalculated) {
    if (["+", "-", "*", "/"].includes(value)) {
      justCalculated = false;
    } else {
      expression = "";
      justCalculated = false;
    }
  }

  if (value === ".") {
    const currentNumber = expression.split(/[+\-*/]/).pop();

    if (currentNumber.includes(".")) return;

    if (!currentNumber) expression += "0";
  }

  expression += value;
  render();
}

    
function calculate() {
  if (!expression) return;

  const safeExpression = expression;

  function showError() {
    expression = "";
    justCalculated = false;
    display.textContent = "Error";

    setTimeout(() => {
      display.textContent = "0";
    }, 1000);
  }

  if (!/^[0-9+\-*/.()\s]+$/.test(safeExpression)) {
    showError();
    return;
  }

  if (/[+\-*/.]$/.test(safeExpression)) {
    showError();
    return;
  }

  try {
    const result = Function(
      '"use strict"; return (' + safeExpression + ')'
    )();

    if (typeof result !== "number" || !Number.isFinite(result)) {
      showError();
      return;
    }

    expression = String(Number(result.toPrecision(12)));
    justCalculated = true;
    render();
  } catch (error) {
    showError();
  }
}
    keys.addEventListener("click", function(event) {
      const button = event.target.closest("button");

      if (!button) return;

      if (button.dataset.action === "clear") {
        clearAll();
      } else if (button.dataset.action === "delete") {
        expression = expression.slice(0, -1);
        justCalculated = false;
        render();
      } else if (button.dataset.action === "calculate") {
        calculate();
      } else if (button.dataset.value !== undefined) {
        appendValue(button.dataset.value);
      }
    });

    closeBtn.addEventListener("click", clearAll);

    document.addEventListener("keydown", function(event) {
      if (/^[0-9.]$/.test(event.key)) {
        appendValue(event.key);
      } else if (["+", "-", "*", "/"].includes(event.key)) {
        appendValue(event.key);
      } else if (event.key === "Enter" || event.key === "=") {
        event.preventDefault();
        calculate();
      } else if (event.key === "Backspace") {
        expression = expression.slice(0, -1);
        justCalculated = false;
        render();
      } else if (event.key === "Escape" || event.key === "Delete") {
        clearAll();
      }
    });
  </script>

  <script>
(function () {
  const installKey = "jambPwaInstallTracked";

  function sendInstallEvent(method) {
    if (localStorage.getItem(installKey) === "yes") return;

    if (typeof gtag !== "function") return;

    gtag("event", "pwa_install", {
      installation_method: method,
      app_platform: /iPhone|iPad|iPod/i.test(navigator.userAgent)
        ? "apple_mobile"
        : /Android/i.test(navigator.userAgent)
          ? "android"
          : "desktop_or_other"
    });

    localStorage.setItem(installKey, "yes");
  }

  window.addEventListener("appinstalled", function () {
    sendInstallEvent("automatic_appinstalled_event");
  });

  const isInstalled =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;

  if (isInstalled && localStorage.getItem(installKey) !== "yes") {
    const button = document.createElement("button");
    button.textContent = "Confirm app installation";
    button.style.cssText =
      "display:block;margin:10px auto;padding:12px 18px;border:0;border-radius:10px;background:#087A50;color:white;font-weight:bold;";

    button.addEventListener("click", function () {
      sendInstallEvent("user_confirmed_in_installed_app");
      if (localStorage.getItem(installKey) === "yes") {
        button.textContent = "Installation recorded ✓";
        button.disabled = true;
      }
    });

    document.querySelector(".calculator").appendChild(button);
  }
})();
